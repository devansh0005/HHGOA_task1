<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HH Goa 2026 | ID Generator</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <meta name="description" content="Official HH Goa 2026 PFP & ID Card Generator">
</head>
<body>

    <!-- Dynamic Image Background -->
    <div class="tropical-image-bg"></div>

    <main class="container py-5 min-vh-100 d-flex flex-column align-items-center position-relative z-1">
        
        <!-- Header Image Logo -->
        <header class="text-center mb-5 animate-slide-down">
            <img src="assets/logo.png" alt="Hacker House Goa Logo" class="brand-logo-img">
        </header>

        <!-- Glassmorphism Card -->
        <div class="card generator-card shadow-lg w-100 animate-fade-in" style="max-width: 650px;">
            <div class="card-body p-4 p-md-5">
                
                <!-- Format Toggle (Hidden by default, locked to Builder ID) -->
                <div class="mb-5 text-center" style="display: none;">
                    <label class="form-label d-block text-white mb-3">SELECT YOUR BADGE</label>
                    <div class="format-toggle d-inline-flex rounded-pill p-1">
                        <input type="radio" class="btn-check" name="format" id="formatA" value="A" autocomplete="off">
                        <label class="btn btn-outline-light rounded-pill px-4 toggle-btn" for="formatA">Profile Frame</label>

                        <input type="radio" class="btn-check" name="format" id="formatB" value="B" autocomplete="off" checked>
                        <label class="btn btn-outline-light rounded-pill px-4 toggle-btn" for="formatB">Builder ID Card</label>
                    </div>
                </div>

                <!-- Step 1: Upload -->
                <div class="mb-5">
                    <h5 class="step-title"><span>1</span> Upload Your Photo</h5>
                    <div class="upload-zone position-relative rounded-4 d-flex align-items-center justify-content-center text-center p-4 mt-3" id="dropzone">
                        <input type="file" id="photoUpload" class="position-absolute w-100 h-100 opacity-0 cursor-pointer" accept="image/*, image/heic">
                        <div id="uploadPlaceholder">
                            <div class="upload-icon mb-3">📸</div>
                            <h6 class="text-white mb-1">Click or drag photo to upload</h6>
                            <small class="text-white-50">JPG, PNG, HEIC accepted</small>
                        </div>
                        <div id="uploadLoading" class="d-none">
                            <div class="spinner-border text-yellow" role="status"></div>
                            <p class="mt-2 mb-0 text-white">Processing magic...</p>
                        </div>
                    </div>
                </div>

                <!-- Format B Fields: Info Input -->
                <div id="formatBFields" class="mb-5">
                    <h5 class="step-title"><span>2</span> Builder Details</h5>
                    <div class="row g-3 mt-2">
                        <div class="col-md-6">
                            <label class="form-label text-white-50 small">Your Name</label>
                            <input type="text" class="form-control glass-input" id="userName" placeholder="e.g. Devansh Mittal" maxlength="20">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-white-50 small">Your Expertise/Role</label>
                            <input type="text" class="form-control glass-input" id="userStack" placeholder="e.g. Fullstack Engineer" maxlength="25">
                        </div>
                    </div>
                </div>

                <!-- Step 3: Preview -->
                <div id="previewArea" class="d-none animate-fade-in text-center mt-5">
                    <h5 class="step-title text-start mb-4"><span>3</span> Your Badge</h5>
                    <div class="canvas-container d-inline-block shadow-lg rounded-4 overflow-hidden" id="canvasWrapper">
                        <!-- Canvas element where the magic happens -->
                        <canvas id="resultCanvas" class="img-fluid"></canvas>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div id="actionButtons" class="d-none d-flex flex-column flex-sm-row gap-3 mt-5">
                    <button id="downloadBtn" class="btn btn-primary flex-grow-1 py-3 rounded-pill fw-bold action-btn d-flex align-items-center justify-content-center gap-2">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
                        Download Image
                    </button>
                    <button id="shareBtn" class="btn btn-dark flex-grow-1 py-3 rounded-pill fw-bold action-btn share-btn d-flex align-items-center justify-content-center gap-2">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865l8.875 11.633Z"/></svg>
                        <span id="shareText">Share to X</span>
                        <div id="shareLoading" class="spinner-border spinner-border-sm ms-2" style="display: none;" role="status"></div>
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- Scripts -->
    <!-- HEIC to Any for iOS Upload Support -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/heic2any.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
